<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PPG Monitor — Realtime</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans+Condensed:wght@600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">PPG Monitor</span>
      </div>

      <div class="topbar-chips">
        <span class="chip">
          <span class="chip-key">Alat</span>
          <span class="chip-val" id="chip-device">—</span>
        </span>
        <span class="chip" id="chip-mode-wrap" data-mode="idle">
          <span class="chip-key">Mode</span>
          <span class="chip-val" id="chip-mode">idle</span>
        </span>
      </div>

      <div class="topbar-lamps">
        <span class="lamp" id="lamp-broker" data-state="off">
          <i aria-hidden="true"></i>Broker <b id="lamp-broker-text">terputus</b>
        </span>
        <span class="lamp" id="lamp-device" data-state="unknown">
          <i aria-hidden="true"></i>Alat <b id="lamp-device-text">belum diketahui</b>
        </span>
        <button type="button" class="ghost-btn" id="panel-toggle" aria-expanded="true" aria-controls="connection">
          Koneksi
        </button>
      </div>
    </header>

    <section class="connection" id="connection">
      <form class="conn-form" id="conn-form" autocomplete="off">
        <p class="field">
          <label for="account-role">Tipe akun</label>
          <select id="account-role">
            <option value="device">Akun alat — pantau alat sendiri</option>
            <option value="dashboard">Akun dashboard — pantau semua alat</option>
          </select>
        </p>
        <p class="field field-wide">
          <label for="host">Broker host</label>
          <input id="host" spellcheck="false">
        </p>
        <p class="field field-narrow">
          <label for="port">Port</label>
          <input id="port" inputmode="numeric" spellcheck="false">
        </p>
        <p class="field">
          <label for="device-id">Device ID</label>
          <input id="device-id" spellcheck="false">
        </p>
        <p class="field">
          <label for="username">Username</label>
          <input id="username" autocomplete="username" spellcheck="false">
        </p>
        <p class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password">
        </p>
        <button class="primary-btn" id="connect-button" type="submit">Hubungkan</button>
      </form>
      <p class="conn-hint" id="conn-hint"></p>
    </section>

    <div class="alert" id="alert" hidden>
      <span class="alert-mark" aria-hidden="true"></span>
      <span class="alert-text">
        <b id="alert-title"></b>
        <span id="alert-body"></span>
      </span>
    </div>

    <section class="session" id="session" data-state="idle">
      <span class="session-dot" aria-hidden="true"></span>
      <span class="session-label" id="session-label">Menunggu alat</span>
      <code class="session-id" id="session-id">—</code>
      <span class="session-timer" id="session-timer"></span>
      <span class="session-track"><i id="session-bar"></i></span>
    </section>

    <main class="stage">
      <div class="stage-main">
        <section class="panel trace-panel">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Pleth · raw ADC</p>
              <h2>Waveform</h2>
            </div>
            <div class="trace-meta">
              <span id="trace-rate">— Hz</span>
              <span id="trace-seq">seq —</span>
              <span id="sample-count">0 sampel</span>
            </div>
          </div>
          <canvas id="chart" role="img" aria-label="Grafik waveform PPG realtime"></canvas>
        </section>

        <section class="panel">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Cepstral</p>
              <h2>MFCC</h2>
            </div>
            <span class="panel-note" id="mfcc-meta">menunggu data</span>
          </div>
          <div class="mfcc" id="mfcc-bars"></div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Diagnostik</p>
              <h2>Langganan topic</h2>
            </div>
            <span class="panel-note" id="link-meta">belum terhubung</span>
          </div>
          <div class="link-scroll">
            <table class="link">
              <thead>
                <tr><th>Topic</th><th>Izin broker</th><th>Pesan</th><th>Terakhir</th></tr>
              </thead>
              <tbody id="link-rows"></tbody>
            </table>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Sesi</p>
              <h2>Hasil terakhir</h2>
            </div>
            <span class="tag" id="result-status">belum ada</span>
          </div>
          <dl class="result" id="result-grid"></dl>
        </section>
      </div>

      <aside class="vitals" id="vitals"></aside>
    </main>

    <script
      src="https://unpkg.com/mqtt@5.15.2/dist/mqtt.min.js"
      integrity="sha384-haZiwxTLortiFcYMBEEE1+8ayC+o18YtuwHZv+4WQHoPaLzRjwOV6h7Vva5iLSCZ"
      crossorigin="anonymous"></script>
    <script src="app.js"></script>
  </body>
</html>
