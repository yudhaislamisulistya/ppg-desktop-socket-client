name: sivia-glucometer

services:
  frontend:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GLUCOMETER_FRONTEND_PORT:-8098}:8080"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    user: "65532:65532"
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --config
      - /etc/cloudflared/config.yml
      - run
      - ${GLUCOMETER_TUNNEL_ID:?GLUCOMETER_TUNNEL_ID wajib diisi di .env.frontend}
    volumes:
      - ./deploy/frontend/cloudflared.yml:/etc/cloudflared/config.yml:ro
      - ./deploy/frontend/credentials.json:/etc/cloudflared/credentials.json:ro
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
